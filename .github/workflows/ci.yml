name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "SonrisaDigital_Test123!"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      SONRISADIGITAL_TEST_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=SonrisaDigital_Test123!;TrustServerCertificate=True;MultipleActiveResultSets=True"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore SonrisaDigital.slnx

      - name: Compilar sin warnings
        run: dotnet build SonrisaDigital.slnx -c Release --no-restore -warnaserror

      - name: Ejecutar pruebas
        run: >-
          dotnet test tests/SonrisaDigital.Tests/SonrisaDigital.Tests.csproj
          -c Release
          --no-build
          --results-directory tests/SonrisaDigital.Tests/TestResults
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Verificar cobertura mínima
        shell: pwsh
        run: >-
          ./scripts/verificar-cobertura.ps1
          -RutaResultados tests/SonrisaDigital.Tests/TestResults
          -MinimoLinea 0.60

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            tests/SonrisaDigital.Tests/TestResults/**/*.trx
            tests/SonrisaDigital.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  publish:
    name: Publicar artefacto
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore SonrisaDigital.slnx

      - name: Publicar aplicación
        run: >-
          dotnet publish src/SonrisaDigital.UI/SonrisaDigital.UI.csproj
          -c Release
          --no-restore
          -o publish

      - name: Guardar artefacto de publicación
        uses: actions/upload-artifact@v4
        with:
          name: sonrisadigital-publicacion
          path: publish/
          if-no-files-found: error
