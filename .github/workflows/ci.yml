name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Compilar y probar (${{ matrix.nombre }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # La misma suite se ejecuta con el servidor en UTC y en la zona del negocio.
    # Así una regresión que dependa de la zona horaria del servidor falla aquí
    # y no en producción.
    strategy:
      fail-fast: false
      matrix:
        include:
          - tz: UTC
            nombre: UTC
          - tz: America/Santo_Domingo
            nombre: Santo_Domingo

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "SonrisaDigital_Test123!"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      TZ: ${{ matrix.tz }}
      SONRISADIGITAL_TEST_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=SonrisaDigital_Test123!;TrustServerCertificate=True;MultipleActiveResultSets=True"

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore SonrisaDigital.slnx

      - name: Compilar sin warnings
        run: dotnet build SonrisaDigital.slnx -c Release --no-restore -warnaserror

      - name: Ejecutar pruebas
        run: >-
          dotnet test tests/SonrisaDigital.Tests/SonrisaDigital.Tests.csproj
          -c Release
          --no-build
          --results-directory tests/SonrisaDigital.Tests/TestResults
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Verificar cobertura mínima
        shell: pwsh
        run: >-
          ./scripts/verificar-cobertura.ps1
          -RutaResultados tests/SonrisaDigital.Tests/TestResults
          -MinimoLinea 0.60

      # Solo se guardan evidencias cuando algo falla. La cuenta Free de GitHub tiene
      # 500 MB para artefactos: subirlos en cada ejecución agota la cuota y hace
      # fallar el job con "Artifact storage quota has been hit".
      # Además es informativo: una cuota agotada no debe marcar como fallida una
      # compilación que ya pasó las pruebas.
      - name: Publicar resultados de pruebas
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: resultados-pruebas-${{ matrix.nombre }}
          retention-days: 3
          compression-level: 9
          path: |
            tests/SonrisaDigital.Tests/TestResults/**/*.trx
            tests/SonrisaDigital.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  # El procesamiento de imágenes (System.Drawing) solo funciona en Windows, que es donde corre
  # la aplicación. Este job prueba esa parte sin necesitar SQL Server.
  imagenes-windows:
    name: Imágenes (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore SonrisaDigital.slnx

      - name: Probar procesamiento de imágenes
        run: >-
          dotnet test tests/SonrisaDigital.Tests/SonrisaDigital.Tests.csproj
          -c Release
          --filter "FullyQualifiedName~ImagenArchivoTests"

  e2e:
    name: Pruebas E2E
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "SonrisaDigital_Test123!"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      MSSQL_SA_PASSWORD: "SonrisaDigital_Test123!"
      SONRISADIGITAL_E2E_DB_CONNECTION: "Server=localhost,1433;Database=SonrisaDigitalE2E;User Id=sa;Password=SonrisaDigital_Test123!;TrustServerCertificate=True;MultipleActiveResultSets=True"
      SONRISADIGITAL_E2E_EMAIL: "e2e.admin@sonrisadigital.test"
      SONRISADIGITAL_E2E_PASSWORD: "E2E_Admin_2026!Segura"
      SONRISADIGITAL_E2E_DUENO_EMAIL: "e2e.dueno@sonrisadigital.test"
      SONRISADIGITAL_E2E_DUENO_PASSWORD: "E2E_Dueno_2026!Segura"
      SONRISADIGITAL_E2E_BASE_URL: "http://localhost:5175"
      # Segunda instancia con Seguridad:MfaDuenoObligatorio=true, para probar el segundo factor.
      SONRISADIGITAL_E2E_MFA_DB_CONNECTION: "Server=localhost,1433;Database=SonrisaDigitalE2EMfa;User Id=sa;Password=SonrisaDigital_Test123!;TrustServerCertificate=True;MultipleActiveResultSets=True"
      SONRISADIGITAL_E2E_MFA_DUENO_EMAIL: "e2e.dueno.mfa@sonrisadigital.test"
      SONRISADIGITAL_E2E_MFA_DUENO_PASSWORD: "E2E_DuenoMfa_2026!Segura"
      SONRISADIGITAL_E2E_MFA_BASE_URL: "http://localhost:5176"
      # La suite inicia sesión más de 5 veces por minuto desde la misma IP (un
      # login por prueba más los reintentos). Sin este límite el POST de login
      # recibe 429 y el navegador se queda en /account/login.
      Authentication__LoginPermitLimit: "50"
      Authentication__LoginCuentaPermitLimit: "100"

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/SonrisaDigital.E2E/package-lock.json

      - name: Restaurar dependencias .NET
        run: dotnet restore SonrisaDigital.slnx

      - name: Compilar sin warnings
        run: dotnet build SonrisaDigital.slnx -c Release --no-restore -warnaserror

      - name: Restaurar herramientas locales
        run: dotnet tool restore

      - name: Aplicar migraciones a la base E2E
        run: >-
          dotnet ef database update
          --project src/SonrisaDigital.Data
          --startup-project src/SonrisaDigital.UI
          --configuration Release
          --no-build
          --connection "$SONRISADIGITAL_E2E_DB_CONNECTION"

      - name: Aplicar migraciones a la base E2E con segundo factor
        run: >-
          dotnet ef database update
          --project src/SonrisaDigital.Data
          --startup-project src/SonrisaDigital.UI
          --configuration Release
          --no-build
          --connection "$SONRISADIGITAL_E2E_MFA_DB_CONNECTION"

      - name: Instalar dependencias E2E
        working-directory: tests/SonrisaDigital.E2E
        run: npm ci

      - name: Instalar Chromium
        working-directory: tests/SonrisaDigital.E2E
        run: npx playwright install --with-deps chromium

      - name: Arrancar aplicación para E2E
        shell: bash
        run: |
          export ConnectionStrings__DefaultConnection="$SONRISADIGITAL_E2E_DB_CONNECTION"
          export Authentication__AdminEmail="$SONRISADIGITAL_E2E_EMAIL"
          export Authentication__AdminPassword="$SONRISADIGITAL_E2E_PASSWORD"
          export Dueno__Email="$SONRISADIGITAL_E2E_DUENO_EMAIL"
          export Dueno__Password="$SONRISADIGITAL_E2E_DUENO_PASSWORD"
          export ASPNETCORE_ENVIRONMENT=Development
          export ASPNETCORE_URLS="$SONRISADIGITAL_E2E_BASE_URL"
          # Solo para las pruebas E2E: el Dueño de prueba entra sin segundo factor.
          export Seguridad__MfaDuenoObligatorio=false

          nohup dotnet run \
            --project src/SonrisaDigital.UI/SonrisaDigital.UI.csproj \
            -c Release \
            --no-build \
            --no-launch-profile \
            > e2e-app.log 2>&1 &
          echo $! > e2e-app.pid

          for intento in $(seq 1 60); do
            if curl -fsS "$SONRISADIGITAL_E2E_BASE_URL/health/ready" > /dev/null; then
              break
            fi
            sleep 2
            if [ "$intento" -eq 60 ]; then cat e2e-app.log; exit 1; fi
          done

          # Segunda instancia: mismo código, otra base y el segundo factor obligatorio.
          export ConnectionStrings__DefaultConnection="$SONRISADIGITAL_E2E_MFA_DB_CONNECTION"
          export Dueno__Email="$SONRISADIGITAL_E2E_MFA_DUENO_EMAIL"
          export Dueno__Password="$SONRISADIGITAL_E2E_MFA_DUENO_PASSWORD"
          export ASPNETCORE_URLS="$SONRISADIGITAL_E2E_MFA_BASE_URL"
          export Seguridad__MfaDuenoObligatorio=true

          nohup dotnet run \
            --project src/SonrisaDigital.UI/SonrisaDigital.UI.csproj \
            -c Release \
            --no-build \
            --no-launch-profile \
            > e2e-app-mfa.log 2>&1 &
          echo $! > e2e-app-mfa.pid

          for intento in $(seq 1 60); do
            if curl -fsS "$SONRISADIGITAL_E2E_MFA_BASE_URL/health/ready" > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat e2e-app-mfa.log
          exit 1

      - name: Ejecutar pruebas E2E
        working-directory: tests/SonrisaDigital.E2E
        run: npx playwright test

      - name: Detener aplicación
        if: always()
        shell: bash
        run: |
          for archivo in e2e-app.pid e2e-app-mfa.pid; do
            if [ -f "$archivo" ]; then
              kill "$(cat "$archivo")" || true
            fi
          done
          pkill -f 'SonrisaDigital.UI' || true
          sleep 2

      - name: Eliminar bases E2E
        if: always()
        shell: bash
        run: |
          for base in SonrisaDigitalE2E SonrisaDigitalE2EMfa; do
            /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U sa \
              -P "$MSSQL_SA_PASSWORD" \
              -C \
              -Q "IF DB_ID(N'$base') IS NOT NULL BEGIN ALTER DATABASE [$base] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [$base]; END" || true
          done

      - name: Publicar evidencias E2E
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-e2e
          retention-days: 3
          compression-level: 9
          path: |
            tests/SonrisaDigital.E2E/test-results/
            tests/SonrisaDigital.E2E/playwright-report/
            e2e-app.log
            e2e-app-mfa.log
          if-no-files-found: warn

  publish:
    name: Publicar artefacto
    needs: [build-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore SonrisaDigital.slnx

      - name: Publicar aplicación
        run: >-
          dotnet publish src/SonrisaDigital.UI/SonrisaDigital.UI.csproj
          -c Release
          --no-restore
          -o publish

      # La configuración local puede contener credenciales y no debe viajar en
      # el artefacto que se instala en producción.
      - name: Verificar publicación sin configuración local
        shell: pwsh
        run: |
          $archivosLocales = @(
            "publish/appsettings.Development.json",
            "publish/appsettings.Development.example.json"
          )

          foreach ($archivo in $archivosLocales) {
            if (Test-Path -LiteralPath $archivo) {
              throw "La publicación contiene $archivo. Revisa CopyToPublishDirectory en el csproj."
            }
          }

          Write-Host "Publicación sin appsettings de desarrollo."

      - name: Guardar artefacto de publicación
        uses: actions/upload-artifact@v7
        with:
          name: sonrisadigital-publicacion
          # La cuenta Free de GitHub tiene 500 MB de almacenamiento de artefactos.
          # Esta publicación se descarga a los pocos días de fusionar en main, así
          # que no necesita la retención por defecto de 90 días.
          retention-days: 3
          compression-level: 9
          path: publish
          if-no-files-found: error
