name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Falla si algún paquete NuGet (directo o transitivo) tiene una vulnerabilidad conocida.
  dependencias:
    name: Vulnerabilidades en paquetes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore SonrisaDigital.slnx

      - name: Buscar paquetes vulnerables
        shell: pwsh
        run: |
          $salida = dotnet list SonrisaDigital.slnx package --vulnerable --include-transitive | Out-String
          Write-Host $salida
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet list package terminó con error."
          }
          if ($salida -match "has the following vulnerable packages") {
            throw "Hay paquetes NuGet con vulnerabilidades conocidas. Revisa la lista de arriba y actualiza el paquete."
          }

  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      SONRISADIGITAL_TEST_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;MultipleActiveResultSets=True"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore SonrisaDigital.slnx

      - name: Compilar sin warnings
        run: dotnet build SonrisaDigital.slnx -c Release --no-restore -warnaserror

      - name: Ejecutar pruebas
        run: >-
          dotnet test tests/SonrisaDigital.Tests/SonrisaDigital.Tests.csproj
          -c Release
          --no-build
          --results-directory tests/SonrisaDigital.Tests/TestResults
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Verificar cobertura mínima
        shell: pwsh
        run: >-
          ./scripts/verificar-cobertura.ps1
          -RutaResultados tests/SonrisaDigital.Tests/TestResults
          -MinimoLinea 0.60

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            tests/SonrisaDigital.Tests/TestResults/**/*.trx
            tests/SonrisaDigital.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  # El procesamiento de imágenes (System.Drawing) solo funciona en Windows, que es donde corre
  # la aplicación. Este job prueba esa parte sin necesitar SQL Server.
  imagenes-windows:
    name: Imágenes (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore SonrisaDigital.slnx

      - name: Probar procesamiento de imágenes
        run: >-
          dotnet test tests/SonrisaDigital.Tests/SonrisaDigital.Tests.csproj
          -c Release
          --filter "FullyQualifiedName~ImagenArchivoTests"

  e2e:
    name: Pruebas E2E
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
      SONRISADIGITAL_E2E_DB_CONNECTION: "Server=localhost,1433;Database=SonrisaDigitalE2E;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;MultipleActiveResultSets=True"
      SONRISADIGITAL_E2E_EMAIL: "e2e.admin@sonrisadigital.test"
      SONRISADIGITAL_E2E_PASSWORD: ${{ secrets.CI_E2E_ADMIN_PASSWORD }}
      SONRISADIGITAL_E2E_DUENO_EMAIL: "e2e.dueno@sonrisadigital.test"
      SONRISADIGITAL_E2E_DUENO_PASSWORD: ${{ secrets.CI_E2E_DUENO_PASSWORD }}
      SONRISADIGITAL_E2E_BASE_URL: "http://localhost:5175"
      # La suite inicia sesión más de 5 veces por minuto desde la misma IP (un
      # login por prueba más los reintentos). Sin este límite el POST de login
      # recibe 429 y el navegador se queda en /account/login.
      Authentication__LoginPermitLimit: "50"
      Authentication__LoginCuentaPermitLimit: "100"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/SonrisaDigital.E2E/package-lock.json

      - name: Restaurar dependencias .NET
        run: dotnet restore SonrisaDigital.slnx

      - name: Compilar sin warnings
        run: dotnet build SonrisaDigital.slnx -c Release --no-restore -warnaserror

      - name: Restaurar herramientas locales
        run: dotnet tool restore

      - name: Aplicar migraciones a la base E2E
        run: >-
          dotnet ef database update
          --project src/SonrisaDigital.Data
          --startup-project src/SonrisaDigital.UI
          --configuration Release
          --no-build
          --connection "$SONRISADIGITAL_E2E_DB_CONNECTION"

      - name: Instalar dependencias E2E
        working-directory: tests/SonrisaDigital.E2E
        run: npm ci

      - name: Instalar Chromium
        working-directory: tests/SonrisaDigital.E2E
        run: npx playwright install --with-deps chromium

      - name: Arrancar aplicación para E2E
        shell: bash
        run: |
          export ConnectionStrings__DefaultConnection="$SONRISADIGITAL_E2E_DB_CONNECTION"
          export Authentication__AdminEmail="$SONRISADIGITAL_E2E_EMAIL"
          export Authentication__AdminPassword="$SONRISADIGITAL_E2E_PASSWORD"
          export Dueno__Email="$SONRISADIGITAL_E2E_DUENO_EMAIL"
          export Dueno__Password="$SONRISADIGITAL_E2E_DUENO_PASSWORD"
          export ASPNETCORE_ENVIRONMENT=Development
          export ASPNETCORE_URLS="$SONRISADIGITAL_E2E_BASE_URL"
          # Solo para las pruebas E2E: el Dueño de prueba entra sin segundo factor.
          export Seguridad__MfaDuenoObligatorio=false

          nohup dotnet run \
            --project src/SonrisaDigital.UI/SonrisaDigital.UI.csproj \
            -c Release \
            --no-build \
            --no-launch-profile \
            > e2e-app.log 2>&1 &
          echo $! > e2e-app.pid

          for intento in $(seq 1 60); do
            if curl -fsS "$SONRISADIGITAL_E2E_BASE_URL/health/ready" > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat e2e-app.log
          exit 1

      - name: Ejecutar pruebas E2E
        working-directory: tests/SonrisaDigital.E2E
        run: npx playwright test

      - name: Detener aplicación
        if: always()
        shell: bash
        run: |
          if [ -f e2e-app.pid ]; then
            kill "$(cat e2e-app.pid)" || true
          fi
          pkill -f 'SonrisaDigital.UI' || true
          sleep 2

      - name: Eliminar base E2E
        if: always()
        shell: bash
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C \
            -Q "IF DB_ID(N'SonrisaDigitalE2E') IS NOT NULL BEGIN ALTER DATABASE [SonrisaDigitalE2E] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [SonrisaDigitalE2E]; END" || true

      - name: Publicar evidencias E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e
          path: |
            tests/SonrisaDigital.E2E/test-results/
            tests/SonrisaDigital.E2E/playwright-report/
            e2e-app.log
          if-no-files-found: warn

  publish:
    name: Publicar artefacto
    needs: [build-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore SonrisaDigital.slnx

      - name: Publicar aplicación
        run: >-
          dotnet publish src/SonrisaDigital.UI/SonrisaDigital.UI.csproj
          -c Release
          --no-restore
          -o publish

      # La configuración local puede contener credenciales y no debe viajar en
      # el artefacto que se instala en producción.
      - name: Verificar publicación sin configuración local
        shell: pwsh
        run: |
          $archivosLocales = @(
            "publish/appsettings.Development.json",
            "publish/appsettings.Development.example.json"
          )

          foreach ($archivo in $archivosLocales) {
            if (Test-Path -LiteralPath $archivo) {
              throw "La publicación contiene $archivo. Revisa CopyToPublishDirectory en el csproj."
            }
          }

          Write-Host "Publicación sin appsettings de desarrollo."

      - name: Guardar artefacto de publicación
        uses: actions/upload-artifact@v4
        with:
          name: sonrisadigital-publicacion
          path: publish/
          if-no-files-found: error
