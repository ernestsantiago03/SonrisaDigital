# Balanceador de Sonrisa Digital para docker compose.
#
# La aplicacion es Blazor Server: el cliente negocia un circuito SignalR y luego
# mantiene un WebSocket. El negotiate y el WebSocket deben caer en la misma
# replica, por eso se usa afinidad (sticky) por cookie. No usar round-robin
# simple: el circuito se perderia entre peticiones.
#
# El upstream resuelve el nombre del servicio `app` al arrancar. Docker devuelve
# una IP por cada replica; nginx las agrega todas. Si se cambia el numero de
# replicas en caliente, reiniciar nginx para que vuelva a resolver:
#   docker compose restart nginx

worker_processes  auto;
pid               C:/nginx/logs/nginx.pid;
error_log         C:/nginx/logs/error.log warn;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'corr=$http_x_correlation_id';
    access_log  C:/nginx/logs/access.log  main;

    sendfile           on;
    keepalive_timeout  65;

    # Las imagenes del odontograma llegan por formulario; la aplicacion acepta
    # hasta 20 MB mas el margen del formulario.
    client_max_body_size  25m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Si delante de nginx hay otro proxy que termina TLS, conservar su
    # X-Forwarded-Proto; si no, usar el esquema de esta conexión.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Clave de afinidad. Las cookies del navegador (autenticacion y antiforgery)
    # son estables durante la sesion, de modo que todas las peticiones de un
    # mismo navegador van a la misma replica. Sin cookies se usa la IP.
    map $http_cookie $sticky_key {
        default $http_cookie;
        ''      $binary_remote_addr;
    }

    upstream sonrisadigital_app {
        hash $sticky_key consistent;
        server app:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Los health checks no necesitan afinidad: se reparten entre las replicas.
    upstream sonrisadigital_health {
        least_conn;
        server app:8080 max_fails=1 fail_timeout=10s;
    }

    server {
        listen       80;
        server_name  _;

        # Live/ready. Se responden antes de la redireccion HTTPS de la app.
        location = /health {
            proxy_pass http://sonrisadigital_health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            access_log off;
        }

        location = /health/ready {
            proxy_pass http://sonrisadigital_health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            access_log off;
        }

        location / {
            proxy_pass http://sonrisadigital_app;
            proxy_http_version 1.1;

            # AllowedHosts de la aplicacion valida el dominio original.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Correlation-Id  $http_x_correlation_id;

            # WebSocket de Blazor Server.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # SignalR mantiene conexiones largas y el render de Blazor usa
            # streaming; no conviene buffear la respuesta.
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;

            # Si una replica esta arrancando, reintentar en la otra.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
